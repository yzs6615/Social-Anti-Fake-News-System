<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Anti-Fake News System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Navigation Bar -->
        <nav class="navbar">
            <div class="nav-container">
                <h1 class="nav-title">Social Anti-Fake News System</h1>
                <div class="nav-actions">
                    <button id="addNewsBtn" class="btn btn-primary">Add News</button>
                </div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Home Page -->
            <div id="homePage" class="page active">
                <div class="page-header">
                    <h2>News List</h2>
                    <div class="filters">
                        <select id="statusFilter" class="filter-select">
                            <option value="all">All News</option>
                            <option value="fake">Fake News</option>
                            <option value="real">Real News</option>
                        </select>
                        <select id="pageSizeSelect" class="filter-select">
                            <option value="5">5 per page</option>
                            <option value="10" selected>10 per page</option>
                            <option value="20">20 per page</option>
                        </select>
                    </div>
                </div>
                <div id="newsList" class="news-list">
                    <!-- News list will be dynamically generated here -->
                </div>
                <div id="pagination" class="pagination">
                    <!-- Pagination controls will be dynamically generated here -->
                </div>
            </div>

            <!-- News Detail Page -->
            <div id="newsDetailPage" class="page">
                <div class="page-header">
                    <button id="backToHome" class="btn btn-secondary">← Back to List</button>
                    <h2 id="detailTitle">News Detail</h2>
                </div>
                <div id="newsDetail" class="news-detail">
                    <!-- News detail will be dynamically generated here -->
                </div>
                <div class="detail-actions">
                    <button id="voteBtn" class="btn btn-primary">Vote</button>
                    <button id="viewCommentsBtn" class="btn btn-secondary">View Comments</button>
                </div>
            </div>

            <!-- Voting Page -->
            <div id="votePage" class="page">
                <div class="page-header">
                    <button id="backToDetail" class="btn btn-secondary">← Back to Detail</button>
                    <h2>Vote</h2>
                </div>
                <div id="voteForm" class="vote-form">
                    <!-- Voting form will be dynamically generated here -->
                </div>
            </div>

            <!-- Comments Page -->
            <div id="commentsPage" class="page">
                <div class="page-header">
                    <button id="backToDetailFromComments" class="btn btn-secondary">← Back to Detail</button>
                    <h2>Comments List</h2>
                </div>
                <div id="commentsList" class="comments-list">
                    <!-- Comments list will be dynamically generated here -->
                </div>
                <div id="commentsPagination" class="pagination">
                    <!-- Comments pagination controls will be dynamically generated here -->
                </div>
            </div>

            <!-- Add News Modal -->
            <div id="addNewsModal" class="modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>Add News</h3>
                        <button id="closeModal" class="close-btn">&times;</button>
                    </div>
                    <form id="addNewsForm" class="modal-form">
                        <div class="form-group">
                            <label for="newsTitle">News Title</label>
                            <input type="text" id="newsTitle" required>
                        </div>
                        <div class="form-group">
                            <label for="newsContent">News Content</label>
                            <textarea id="newsContent" rows="5" required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="newsImage">Event Image URL (Optional)</label>
                            <input type="url" id="newsImage">
                        </div>
                        <div class="form-group">
                            <label for="publisherName">Publisher Name</label>
                            <input type="text" id="publisherName" required>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Publish News</button>
                            <button type="button" id="cancelAdd" class="btn btn-secondary">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
