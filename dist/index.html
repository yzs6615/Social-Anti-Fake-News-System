<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Anti-Fake News System</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>">
    <link rel="stylesheet" href="styles.css" onerror="console.error('Failed to load styles.css');">
</head>
<body>
    <div id="app">
        <!-- Loading indicator (will be removed by JS) -->
        <div id="loadingIndicator" style="text-align: center; padding: 2rem;">
            <p>Loading application...</p>
        </div>
        <!-- Navigation Bar -->
        <nav class="navbar">
            <div class="nav-container">
                <h1 class="nav-title">Social Anti-Fake News System</h1>
                <div class="nav-actions">
                    <button id="addNewsBtn" class="btn btn-primary">Add News</button>
                </div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Home Page -->
            <div id="homePage" class="page active">
                <div class="page-header">
                    <h2>News List</h2>
                    <div class="filters">
                        <select id="statusFilter" class="filter-select">
                            <option value="all">All News</option>
                            <option value="fake">Fake News</option>
                            <option value="real">Real News</option>
                        </select>
                        <select id="pageSizeSelect" class="filter-select">
                            <option value="5">5 per page</option>
                            <option value="10" selected>10 per page</option>
                            <option value="20">20 per page</option>
                        </select>
                    </div>
                </div>
                <div id="newsList" class="news-list">
                    <!-- News list will be dynamically generated here -->
                    <div style="text-align: center; padding: 2rem; color: #666;">
                        <p>Initializing news list...</p>
                    </div>
                </div>
                <div id="pagination" class="pagination">
                    <!-- Pagination controls will be dynamically generated here -->
                </div>
            </div>

            <!-- News Detail Page -->
            <div id="newsDetailPage" class="page">
                <div class="page-header">
                    <button id="backToHome" class="btn btn-secondary">← Back to List</button>
                    <h2 id="detailTitle">News Detail</h2>
                </div>
                <div id="newsDetail" class="news-detail">
                    <!-- News detail will be dynamically generated here -->
                </div>
                <div class="detail-actions">
                    <button id="voteBtn" class="btn btn-primary">Vote</button>
                    <button id="viewCommentsBtn" class="btn btn-secondary">View Comments</button>
                </div>
            </div>

            <!-- Voting Page -->
            <div id="votePage" class="page">
                <div class="page-header">
                    <button id="backToDetail" class="btn btn-secondary">← Back to Detail</button>
                    <h2>Vote</h2>
                </div>
                <div id="voteForm" class="vote-form">
                    <!-- Voting form will be dynamically generated here -->
                </div>
            </div>

            <!-- Comments Page -->
            <div id="commentsPage" class="page">
                <div class="page-header">
                    <button id="backToDetailFromComments" class="btn btn-secondary">← Back to Detail</button>
                    <h2>Comments List</h2>
                </div>
                <div id="commentsList" class="comments-list">
                    <!-- Comments list will be dynamically generated here -->
                </div>
                <div id="commentsPagination" class="pagination">
                    <!-- Comments pagination controls will be dynamically generated here -->
                </div>
            </div>

            <!-- Add News Modal -->
            <div id="addNewsModal" class="modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>Add News</h3>
                        <button id="closeModal" class="close-btn">&times;</button>
                    </div>
                    <form id="addNewsForm" class="modal-form">
                        <div class="form-group">
                            <label for="newsTitle">News Title</label>
                            <input type="text" id="newsTitle" required>
                        </div>
                        <div class="form-group">
                            <label for="newsContent">News Content</label>
                            <textarea id="newsContent" rows="5" required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="newsImage">Event Image URL (Optional)</label>
                            <input type="url" id="newsImage">
                        </div>
                        <div class="form-group">
                            <label for="publisherName">Publisher Name</label>
                            <input type="text" id="publisherName" required>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Publish News</button>
                            <button type="button" id="cancelAdd" class="btn btn-secondary">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Diagnostic script
        console.log('=== DIAGNOSTIC INFO ===');
        console.log('Page URL:', window.location.href);
        console.log('Document ready state:', document.readyState);
        
        // Test resource loading
        function testResource(url, name) {
            return fetch(url, { method: 'HEAD' })
                .then(response => {
                    console.log(name + ':', response.status === 200 ? '✓ Loaded' : '✗ Failed (' + response.status + ')');
                    return response.status === 200;
                })
                .catch(error => {
                    console.error(name + ':', '✗ Error -', error.message);
                    return false;
                });
        }
        
        // Test all resources
        window.addEventListener('load', function() {
            console.log('Testing resources...');
            Promise.all([
                testResource('script.js', 'script.js'),
                testResource('styles.css', 'styles.css')
            ]).then(results => {
                if (!results[0] || !results[1]) {
                    const newsList = document.getElementById('newsList');
                    if (newsList) {
                        newsList.innerHTML = '<div class="empty-state"><h3>Resource Loading Failed</h3><p>One or more resources failed to load. Check the console above for details.</p><p>script.js: ' + (results[0] ? 'OK' : 'FAILED') + '</p><p>styles.css: ' + (results[1] ? 'OK' : 'FAILED') + '</p></div>';
                    }
                }
            });
        });
        
        // Error handler for script loading
        window.addEventListener('error', function(e) {
            console.error('Script error:', e);
            console.error('Error details:', {
                message: e.message,
                filename: e.filename,
                lineno: e.lineno,
                colno: e.colno,
                error: e.error
            });
            
            const newsList = document.getElementById('newsList');
            if (newsList) {
                newsList.innerHTML = '<div class="empty-state"><h3>Error Loading Application</h3><p>Error: ' + e.message + '</p><p>File: ' + (e.filename || 'unknown') + '</p><p>Please check the browser console for details.</p></div>';
            }
        }, true);
    </script>
    <script src="script.js" onerror="console.error('Failed to load script.js'); document.getElementById('newsList').innerHTML='<div class=\'empty-state\'><h3>Script Loading Failed</h3><p>script.js could not be loaded. Please check the file path.</p></div>';"></script>
    <script>
        // Verify script loaded
        setTimeout(function() {
            if (typeof AntiFakeNewsSystem === 'undefined') {
                console.error('AntiFakeNewsSystem class not found!');
                const newsList = document.getElementById('newsList');
                if (newsList) {
                    newsList.innerHTML = '<div class="empty-state"><h3>JavaScript Error</h3><p>The application script failed to load. Please check the browser console and Network tab.</p></div>';
                }
            } else {
                console.log('AntiFakeNewsSystem class found!');
            }
        }, 100);
    </script>
</body>
</html>
